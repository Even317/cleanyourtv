plugins {
    id 'com.android.application'
}

android {
    namespace 'com.x96.remote'
    compileSdk 34

    defaultConfig {
        applicationId 'com.x96.remote'
        minSdk 25
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Zero third-party dependencies: pure Android SDK & standard Java for minimum RAM and max speed
}
